# ===== 运行期指标采集与告警（全部为内存计算，无外部依赖）=====

# 固定滚动窗口长度（毫秒）
metrics.window-size-ms=10000
# 内存中保留的窗口个数（含当前窗口）；超出的窗口会被淘汰，内存上界确定
metrics.retained-windows=3
# 单条时间序列在单个窗口内允许的最大样本数
metrics.max-samples-per-series-window=10000
# 全局最大时间序列（指标名+标签组合）数量
metrics.max-series=10000
# 单个标签 key 允许的不同 value 数量（防标签基数爆炸）
metrics.max-label-values-per-key=2000
# 允许的事件时间相对处理时间的未来偏移上界（毫秒），超出按 TOO_FAR_IN_FUTURE 拒绝
metrics.max-future-skew-ms=60000
# 迟到宽限（毫秒）：超过该宽限的旧样本按 TOO_OLD 拒绝；窗口在“结束+宽限”后封定并触发告警判定
metrics.late-arrival-grace-ms=5000
# ===== 按标签分组的跨序列汇总与分组告警（全部内存计算）=====
# 一次分组查询/分组封定允许的标签取值组合数上限；超限整单失败并返回可区分状态
metrics.max-group-combinations=1000
# 单个分组内允许合并的序列数上限；超限整单失败（不跨组合合并、不静默丢样本）
metrics.max-series-per-group=5000
# 一次分组查询允许请求的窗口数上限（from/to 对齐后的窗口数）
metrics.max-query-windows=1000
# 分组告警状态在分组消失后保留的窗口数；明确保留期内回来不算新触发，超期回来按新组处理
metrics.group-alert-retention-windows=6
